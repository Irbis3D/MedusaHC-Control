[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medusahc-control"
version = "0.1.0"
description = "Local MedusaHC control and diagnostics dashboard for Klipper/Moonraker"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Irbis3D" }]
dependencies = []

[project.scripts]
medusahc-control = "medusahc_control.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["medusahc_control*"]

[tool.setuptools.package-data]
medusahc_control = ["web/*"]

